<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My PWA Catalogue</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>

      <h1>My PWA Catalogue</h1>

      <section class="catalogue">

        <article class="card">
          <h3>Movie 2</h3>

        <article class="card">
          <h3>Movie 3</h3>

          <p>Rating: 5/5</p>
        </article>

    </main>

    <footer>
      <p>Year 12 Software Engineering</p>
    </footer>
  </body>
</html>
